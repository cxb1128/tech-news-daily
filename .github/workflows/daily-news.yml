name: 每日科技新闻

on:
  schedule:
    # 目标 6:10 到达，提前 20 分钟补偿 GitHub Actions 延迟 (21:50 UTC = 5:50 CST)
    - cron: "50 21 * * *"
  workflow_dispatch:  # 支持手动触发

jobs:
  send-news:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 发送每日科技新闻
        env:
          QQ_AUTH_CODE: ${{ secrets.QQ_AUTH_CODE }}
        run: python send_news.py
