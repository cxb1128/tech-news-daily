name: 每日科技新闻

on:
  schedule:
    # Cron 5:00 CST。脚本内 sleep 到 6:05 准时发送，timeout 120min 允许最长 1h 等待
    - cron: "0 21 * * *"
  workflow_dispatch:  # 支持手动触发

jobs:
  send-news:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 发送每日科技新闻
        env:
          QQ_AUTH_CODE: ${{ secrets.QQ_AUTH_CODE }}
        run: python send_news.py
